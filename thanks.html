<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Your Gutter Cleaning</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #f3f7fc 0%, #eef4fb 100%);
      color: #101828;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      padding: 32px;
      background: #fff;
      border: 1px solid #dbe6f5;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(16, 24, 40, 0.1);
      text-align: center;
    }
    .paid {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: #ecfdf3;
      border: 1px solid #abefc6;
      border-radius: 999px;
      color: #067647;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 12px; font-size: 26px; letter-spacing: -0.02em; }
    p { margin: 0 0 20px; color: #475467; line-height: 1.5; }
    .fallback {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 22px;
      background: #1d4ed8;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
    }
    .fallback:hover { background: #1e40af; }
    .spinner {
      margin: 0 auto 16px;
      width: 32px;
      height: 32px;
      border: 3px solid #e4e7ec;
      border-top-color: #1d4ed8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="paid">✓ Deposit received</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Thanks! One last step.</h1>
    <p>Sending you to pick a date for your gutter cleaning&hellip;</p>
    <a id="fallback" class="fallback" href="schedule.html?service=cleaning">Pick a date</a>
  </div>

  <script>
    // Our own scheduler (replaced Calendly 2026-10-22). It reads the lead
    // from localStorage itself (name, email, phone, address, ZIP, timestamp)
    // and the timestamp is how the booking finds its paid row in the sheet.
    const SCHEDULE_URL = 'schedule.html?service=cleaning';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqXVInrbcXK5Z4YLU-rFqa3d4ycv0GYOdSFP_D9O4opkOI1KZQqDCKspUPj6GtYacr/exec';

    function readLead() {
      try {
        const raw = localStorage.getItem('cgp_lastLead');
        if (raw) return JSON.parse(raw);
      } catch (_) { /* ignore */ }
      return null;
    }

    function sendBuyerConfirmation(lead) {
      if (!lead || !lead.email) return;
      // De-dupe: if we already fired the confirmation for this exact lead, skip.
      // (Square can sometimes re-redirect to thanks.html, e.g. on a back button.)
      try {
        const stamp = lead.timestamp || '';
        const seen = localStorage.getItem('cgp_confirmSent');
        if (seen && seen === stamp) return;
        localStorage.setItem('cgp_confirmSent', stamp);
      } catch (_) { /* ignore */ }

      const payload = Object.assign({}, lead, { action: 'confirm' });
      try {
        const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain;charset=utf-8' });
        const queued = navigator.sendBeacon(APPS_SCRIPT_URL, blob);
        if (!queued) {
          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            keepalive: true,
          }).catch(() => {});
        }
      } catch (_) { /* ignore */ }
    }

    const lead = readLead();
    const target = SCHEDULE_URL;
    sendBuyerConfirmation(lead);

    // Funnel analytics: Square only sends people here after a successful
    // payment, so this is the client-side end of the funnel. The authoritative
    // paid count is still the leads sheet (Square is polled directly) — this
    // exists so the event trail has a matching finish line. sendBeacon because
    // we redirect to the scheduler a moment later.
    try {
      // The session id lives in sessionStorage, which some browsers drop across
      // the trip to Square and back (2 of 7 deposits in Sep 2026 came back with
      // none). The lead record and localStorage carry a copy. (2026-09-30)
      let sid = '';
      try { sid = sessionStorage.getItem('cgp_sid') || ''; } catch (_) {}
      if (!sid) { try { sid = (lead && lead.session) || localStorage.getItem('cgp_sid') || ''; } catch (_) {} }
      const evt = {
        action: 'event', event: 'deposit_paid', session: sid,
        device: matchMedia('(max-width: 760px)').matches ? 'mobile' : 'desktop',
        page: location.pathname, price: lead && lead.finalPrice ? lead.finalPrice : '',
        plan: lead && (lead.planName || lead.plan) ? (lead.planName || lead.plan) : '',
      };
      navigator.sendBeacon(APPS_SCRIPT_URL,
        new Blob([JSON.stringify(evt)], { type: 'text/plain;charset=utf-8' }));

      // Supabase — the copy the admin app reads. Publishable key: RLS allows
      // INSERT only, so it can add this row but never read the funnel back.
      fetch('https://wmmhvguajkeiyhmfmilu.supabase.co/rest/v1/booking_events', {
        method: 'POST', keepalive: true,
        headers: { 'apikey': 'sb_publishable_qTRQ_ECvykQgCBHWReXC7w_nt1HUv8Z',
                   'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          event: 'deposit_paid', session: sid,
          device: evt.device, page: location.pathname,
          price: evt.price === '' ? null : Number(evt.price),
          plan: evt.plan || null,
        }),
      }).catch(function () {});
    } catch (e) { /* never block the redirect */ }

    // Small delay so the user sees the "Sending you to..." card briefly,
    // which feels less abrupt than an instant flash-redirect.
    setTimeout(() => { window.location.replace(target); }, 600);
  </script>
</body>
</html>
